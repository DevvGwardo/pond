# Keep dependencies current: npm packages + the GitHub Actions themselves.
# The release flow depends on these updates landing (e.g. Node engine floors,
# action versions), so auto-open PRs rather than leaving it to memory.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Runtime deps are the risky ones (native modules, esbuild); update them
      # as a group so a release can validate the whole set at once. Major
      # bumps (typescript 7, eslint 10, better-sqlite3 13, chokidar 5, ...)
      # need code changes and CI rework, so exclude them from the groups —
      # they arrive as individual PRs for deliberate triage.
      runtime-deps:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      dev-deps:
        dependency-type: "development"
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 10
    versioning-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
