name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        # Exercise Windows on the current LTS so the client CLI (new / dev /
        # deploy / login / dashboard / --generate) stays green for Windows
        # users. Host-side cgroup/sandbox code is Linux-only and no-ops here.
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit
      # The committed generated artifacts (src/ide/built.ts, src/dashboard/
      # built.ts, src/ide/tailwind.css, docs/llms-full.txt) must match what the
      # build produces — a stale committed bundle would ship in every git-based
      # deploy while tests stay green. `npm test` regenerates them; this step
      # fails if that left the tree dirty.
      - name: Verify generated artifacts are current
        run: npm run build && git diff --exit-code -- src/ide/built.ts src/ide/tailwind.css src/dashboard/built.ts docs/llms-full.txt
      # Some tests scaffold a capsule whose template runs `git init && git commit`.
      # Provide a default identity so the commit step doesn't fail in CI even if
      # the test forgets --no-git. Use bash explicitly so the step is identical
      # on the Windows runner (which defaults to PowerShell).
      - run: |
          git config --global user.email "ci@pond.test"
          git config --global user.name "pond ci"
        shell: bash
      - run: npm test
