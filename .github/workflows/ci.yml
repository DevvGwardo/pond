name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      # Some tests scaffold a capsule whose template runs `git init && git commit`.
      # Provide a default identity so the commit step doesn't fail in CI even if
      # the test forgets --no-git.
      - run: |
          git config --global user.email "ci@pond.test"
          git config --global user.name "pond ci"
      - run: npm test
