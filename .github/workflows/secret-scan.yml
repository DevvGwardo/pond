name: secret-scan
# Non-bypassable complement to the local pre-commit hook (scripts/secret-scan.sh),
# which `git commit --no-verify` can skip. gitleaks scans full history on every
# push / PR to main. Free for public repos — no license key required. Verified
# clean against current history before adding, so it lands green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
