# Pond host + Cloudflare Tunnel.
#
# Usage:
#   1. cp deploy/.env.example deploy/.env  and edit the values
#   2. cp deploy/cloudflared/config.example.yml deploy/cloudflared/config.yml
#      and edit the tunnel id + credentials path
#   3. docker compose -f deploy/docker-compose.yml up -d

services:
  pond-host:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Bound the whole control-plane container so a runaway capsule (or a bug in
    # the host process) can't exhaust the box and take every deploy down with
    # it. TUNE these to your host's size — the values below assume a small VM.
    # Per-capsule cpu/memory/pids caps are layered on top via the cgroup
    # isolation setup (deploy/setup-capsule-isolation.sh + README).
    mem_limit: 4g
    cpus: "2.0"
    # Container-wide process ceiling. Must comfortably exceed the sum of active
    # capsules (each is itself capped at 256 pids by its own cgroup).
    pids_limit: 4096
    # Defense-in-depth: a sandbox-escaping capsule shouldn't be able to gain
    # privileges or use ambient capabilities. The control plane needs none of
    # the default caps (cgroup management goes through v2 delegation, not caps).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The tunnel reaches us over the compose network — bind to 0.0.0.0
    # *inside* the container only; the host port is NOT published.
    expose:
      - "8787"
    volumes:
      - pond-data:/data
      # Per-capsule cgroup isolation needs a writable cgroup v2 subtree inside
      # the container. Keep this mount enabled AND set POND_CAPSULE_CGROUP_ROOT
      # in .env (e.g. /sys/fs/cgroup/pond) — without it, capsules fall back to
      # the heap cap only and the egress firewall (which matches on the capsule
      # cgroup) has nothing to match. See deploy/HARDENING.md.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command:
      - node
      - /app/src/cli.js
      - host
      - --port
      - "8787"
      - --host
      - "0.0.0.0"
      - --data-dir
      - /data
      - --public-host
      - ${POND_PUBLIC_HOST}
      - --public-base-url
      - ${POND_PUBLIC_BASE_URL}
      - --abuse-email
      - ${POND_ABUSE_EMAIL}
      - --trust-proxy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - pond-host
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run

volumes:
  pond-data:
